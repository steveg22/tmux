# ============================================================================
# General
# ============================================================================

# True color support
set-option -sa terminal-overrides ",xterm*:Tc"

# Mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Status bar at the top
set -g status-position top

# ============================================================================
# Prefix
# ============================================================================

# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ============================================================================
# Pane navigation
# ============================================================================

# Vim-style pane navigation
# Uncomment if you want Ctrl-b + h/j/k/l to move between panes

# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# ============================================================================
# Window navigation
# ============================================================================

# Alt + Shift + H/L to switch windows
# Uncomment if desired

# bind -n M-H previous-window
# bind -n M-L next-window

# ============================================================================
# Plugins
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# ============================================================================
# Vim mode
# ============================================================================

set-window-option -g mode-keys vi

# Copy-mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================================================
# Terminal
# ============================================================================

# Alacritty
set -g default-terminal "alacritty"

# ============================================================================
# Panes and Windows
# ============================================================================

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Open new panes in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================================================
# Reload config
# ============================================================================

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ============================================================================
# Kanagawa Dragon — Status Bar
# ============================================================================

# Palette:
#
# Background       #181616
# Foreground       #c5c9c5
# Muted            #727169
# Blue             #8ba4b0
# Selection blue   #2d4f67
# Yellow           #c8c093
# Red              #c4746e
# Green            #8a9a7b

# Main status bar
set -g status-style "bg=#181616,fg=#c5c9c5"

# Current window
set -g window-status-current-style "bg=#2d4f67,fg=#c8c093,bold"

# Inactive windows
set -g window-status-style "bg=#181616,fg=#727169"

# Window format
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Left side
set -g status-left ""

# Right side
set -g status-right "#[fg=#727169]%Y-%m-%d #[fg=#c8c093]%H:%M "

# Give the status bar some breathing room
set -g status-left-length 0
set -g status-right-length 50

# ============================================================================
# TPM
# ============================================================================

run '~/.tmux/plugins/tpm/tpm'

